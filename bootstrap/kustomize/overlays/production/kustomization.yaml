apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production
namePrefix: prod-

commonLabels:
  env: production

resources:
  - ../../base

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: hello-world
  - path: resources-patch.yaml
    target:
      kind: Deployment
      name: hello-world

images:
  - name: gcr.io/google-samples/hello-app
    newTag: "2.0"
