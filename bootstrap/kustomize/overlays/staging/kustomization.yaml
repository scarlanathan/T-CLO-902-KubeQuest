apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
namePrefix: staging-

commonLabels:
  env: staging

resources:
  - ../../base

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: hello-world

images:
  - name: gcr.io/google-samples/hello-app
    newTag: "1.0"
