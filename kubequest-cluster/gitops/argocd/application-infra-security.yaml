apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubequest
  source:
    repoURL: https://github.com/EpitechMscProPromo2026/T-CLO-902-PAR_5.git
    targetRevision: main
    path: kubequest-cluster/gitops/infrastructure/base/security
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: opa
  # SYNC MANUEL VOLONTAIRE : cluster bootstrappe a la main avec des versions/
  # namespaces differents du repo. La stack OPA/security n'est pas deployee sur
  # le cluster reel -> cette app materialise le gap. Sync a declencher manuellement.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
