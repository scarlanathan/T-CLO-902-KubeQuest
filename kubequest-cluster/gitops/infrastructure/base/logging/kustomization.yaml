apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

helmCharts:
  - name: loki-stack
    repo: https://grafana.github.io/helm-charts
    version: 2.10.2
    releaseName: loki
    namespace: logging
    valuesFile: values.yaml

resources:
  - namespace.yaml
  - ingress-loki.yaml
  - ingress-grafana.yaml
