# =====================================================
# POINT 3: CERTIFICATS TLS AVEC CERT-MANAGER
# =====================================================

# Namespace pour cert-manager
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
# ClusterIssuer pour Let's Encrypt Staging (pour tests)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@kubequest.local
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: nginx

---
# ClusterIssuer pour Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@kubequest.local
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Mettre à jour l'ingress Laravel avec TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laravel-tls
  namespace: laravel
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - app.kubequest.local
    secretName: app-kubequest-tls
  rules:
  - host: app.kubequest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: laravel
            port:
              number: 80

---
# Mettre à jour l'ingress Grafana avec TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress-tls
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - grafana.kubequest.local
    secretName: grafana-kubequest-tls
  rules:
  - host: grafana.kubequest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-grafana
            port:
              number: 80

---
# Certificate pour Dashboard (auto-signé pour début)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dashboard-cert
  namespace: kubernetes-dashboard
spec:
  secretName: dashboard-tls
  dnsNames:
  - dashboard.kubequest.local
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
