apiVersion: v1
kind: Config
clusters:
- cluster:
    insecure-skip-tls-verify: true
    server: https://127.0.0.1:8001
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: admin-user
  name: admin-user@kubernetes
current-context: admin-user@kubernetes
users:
- name: admin-user
  user:
    token: <REMPLACER_PAR_LE_TOKEN>
# Pour obtenir le token :
# kubectl -n kubernetes-dashboard get secret admin-user-token -o jsonpath='{.data.token}' | base64 -d
# Ou : bash scripts/get-dashboard-token.sh
